name: Release

# Tagging a version (vX.Y.Z, or VX.Y.Z — tag filters are case-sensitive, so
# both are listed) builds the container image and publishes it to
# GHCR as both :latest and :X.Y.Z, then creates a GitHub Release. This is
# what a `docker pull` / Unraid template on the published image points at —
# see README.md's "Releases & the published image" section.

on:
  push:
    tags: ['v*', 'V*']

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive version from the tag
        id: meta
        run: |
          v="${GITHUB_REF_NAME#[vV]}"
          echo "version=${v}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/switchboard-server:latest
            ghcr.io/${{ github.repository_owner }}/switchboard-server:${{ steps.meta.outputs.version }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true